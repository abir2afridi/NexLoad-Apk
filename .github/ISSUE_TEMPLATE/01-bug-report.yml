name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in NexLoad
title: "[BUG]: "
labels: [bug, needs-triage]
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "✅ Prerequisites"
      description: Before submitting, please confirm
      options:
        - label: "🔍 I have searched existing issues and this is not a duplicate"
          required: true
        - label: "📖 I have read the documentation in the README"
          required: true
  - type: markdown
    attributes:
      value: |
        ---
        ## 📱 Device & Environment
  - type: input
    id: app-version
    attributes:
      label: "📦 App Version"
      description: What version of NexLoad are you using?
      placeholder: "e.g., 1.2.0, 1.1.0"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: "🤖 Android Version"
      description: What Android version are you running?
      options:
        - "Android 7.x (API 24-25)"
        - "Android 8.x (API 26-27)"
        - "Android 9.x (API 28)"
        - "Android 10.x (API 29)"
        - "Android 11.x (API 30)"
        - "Android 12.x (API 31-32)"
        - "Android 13.x (API 33)"
        - "Android 14.x (API 34)"
        - "Android 15.x (API 35)"
        - "Android 16.x (API 36)"
        - "❓ Other"
    validations:
      required: true
  - type: dropdown
    id: device-type
    attributes:
      label: "📟 Device Type"
      description: What device are you using?
      options:
        - "📱 Phone"
        - "📟 Tablet"
        - "💻 Chromebook"
        - "🖥️ Emulator"
        - "❓ Other"
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: "🏷️ Device Model"
      description: What is your specific device model (if known)?
      placeholder: "e.g., Pixel 8, Galaxy S24"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        ## 🎬 Affected Download Platform
  - type: dropdown
    id: platform
    attributes:
      label: "🌐 Affected Platform"
      description: Which video platform is affected? (if applicable)
      multiple: true
      options:
        - "🎵 TikTok"
        - "📸 Instagram"
        - "👍 Facebook"
        - "🐦 Twitter / X"
        - "🗨️ Reddit"
        - "📌 Pinterest"
        - "🎧 SoundCloud"
        - "🎥 Vimeo"
        - "📺 Twitch"
        - "▶️ Dailymotion"
        - "📓 Tumblr"
        - "🎮 Steam"
        - "🌍 General / Any Website"
        - "🚫 N/A (not platform-specific)"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        ## 🐞 Bug Details
  - type: textarea
    id: description
    attributes:
      label: "📝 Describe the Bug"
      description: A clear and concise description of what the bug is
      placeholder: "What happened? What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: "🔄 Steps to Reproduce"
      description: Step-by-step instructions to reproduce the behavior
      placeholder: |
        1. Open NexLoad
        2. Paste link '...'
        3. Tap Analyze
        4. See error
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "✅ Expected Behavior"
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "❌ Actual Behavior"
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "⚠️ Severity"
      description: How severe is this bug?
      options:
        - "🔥 Critical — App is unusable"
        - "🔴 High — Major feature broken"
        - "🟡 Medium — Feature partially broken"
        - "🟢 Low — Minor visual or edge case issue"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ## 📎 Additional Information
  - type: textarea
    id: logs
    attributes:
      label: "📋 Logs / Error Output"
      description: Copy any relevant logcat output, crash logs, or error messages
      placeholder: "Paste logcat output here..."
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "📸 Screenshots / Videos"
      description: If applicable, add screenshots or screen recordings to help explain the issue
      placeholder: "Drag and drop images here"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: "➕ Additional Context"
      description: Any other relevant information (e.g., link URL, network type, download settings)
    validations:
      required: false
  - type: checkboxes
    id: coc
    attributes:
      label: "📜 Code of Conduct"
      options:
        - label: "🤝 I agree to follow this project's Code of Conduct"
          required: true
