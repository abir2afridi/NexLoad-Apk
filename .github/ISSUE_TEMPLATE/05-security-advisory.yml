name: "🔒 Security Vulnerability Report"
description: Report a security vulnerability — do NOT file a public issue
title: "[SECURITY]: Private report required"
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        ## 🚨 STOP! This is NOT the right place for security reports.

        ⚠️ **Public issues expose all users to risk.** Please use one of these **private** channels instead:

        ---

        | Method | Link / Address |
        |--------|----------------|
        | 🛡️ **GitHub Security Advisories** | [Click here to report privately](../../security/advisories/new) |
        | 📧 **Email** | [abir2afridi@gmail.com](mailto:abir2afridi@gmail.com) |

        ---

        ### 🔐 What's in scope for NexLoad?

        NexLoad handles sensitive data including:
        - 🍪 Social media login cookies (Instagram, Facebook)
        - 🔏 Private vault files (PIN/biometric-protected storage)
        - 📜 Download history and bookmarks
        - 💾 Local file system access

        ### 🌟 Thank you

        Your help keeping NexLoad secure is greatly appreciated. We respond to all reports within **72 hours**.

        ---
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: "✅ I Understand"
      options:
        - label: >
            🛡️ I understand this is not the right form for security reports.
            I will use the private reporting channels above.
          required: true
